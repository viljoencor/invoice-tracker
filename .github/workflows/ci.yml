name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  pull-requests: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io


# ============================================================================
# A. Backend quality - ALL gates are blocking
# ============================================================================
jobs:

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (incl. dev)
        run: uv sync --all-extras --dev

      - name: Lint (Ruff)
        run: uv run ruff check app tests

      - name: Format check (Ruff)
        run: uv run ruff format --check app tests

      - name: Type check (MyPy)
        run: uv run mypy app

      - name: Security scan (Bandit)
        run: uv run bandit -r app -ll

      - name: Tests with coverage
        env:
          JWT_SECRET: _Bk2swV-irvgVGswT169WWh4ty2DFVgvTS9q3_KtlHo
          ENVIRONMENT: development
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false


  # ==========================================================================
  # B. Frontend quality - ALL gates are blocking
  # ==========================================================================

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        # Production dependencies only.
        # HIGH and CRITICAL findings block the pipeline.
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Nuxt type stubs
        run: npx nuxt prepare

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: apps/frontend/coverage/
          flags: frontend
          fail_ci_if_error: false

      - name: Production build
        # NUXT_API_BASE is runtime-only private config.
        run: npm run build


  # ==========================================================================
  # C + D. Integration & E2E
  # ==========================================================================

  integration:
    name: Integration & E2E
    runs-on: ubuntu-latest

    needs:
      - backend-quality
      - frontend-quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------------------
      # Build and start integration stack
      #
      # If Compose itself fails because a health check fails, dump the
      # container state and service logs immediately before failing the step.
      # ----------------------------------------------------------------------

      - name: Start full stack
        working-directory: infra
        run: |
          set +e

          docker compose up --build -d
          COMPOSE_EXIT=$?

          if [ "$COMPOSE_EXIT" -ne 0 ]; then
            echo ""
            echo "============================================================"
            echo "Docker Compose failed to start the stack"
            echo "============================================================"
            echo ""

            echo "=== Container status ==="
            docker compose ps -a || true

            echo ""
            echo "=== Backend logs ==="
            docker compose logs --no-color backend || true

            echo ""
            echo "=== Frontend logs ==="
            docker compose logs --no-color frontend || true

            echo ""
            echo "=== Database logs ==="
            docker compose logs --no-color db || true

            echo ""
            echo "=== Backend health state ==="
            BACKEND_ID=$(docker compose ps -q backend)

            if [ -n "$BACKEND_ID" ]; then
              docker inspect \
                --format='{{json .State.Health}}' \
                "$BACKEND_ID" || true
            fi

            exit "$COMPOSE_EXIT"
          fi


      # ----------------------------------------------------------------------
      # Backend readiness
      # ----------------------------------------------------------------------

      - name: Wait for backend readiness
        run: |
          echo "Polling http://localhost:8000/healthz (max 120 s)..."

          for i in $(seq 1 60); do

            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend ready after $((i * 2)) s"
              exit 0
            fi

            if [ "$i" -eq 60 ]; then
              echo ""
              echo "Backend did not become ready within 120 s"
              echo ""

              echo "=== Container status ==="
              docker compose -f infra/docker-compose.yml ps -a || true

              echo ""
              echo "=== Backend logs ==="
              docker compose -f infra/docker-compose.yml \
                logs --no-color backend || true

              exit 1
            fi

            sleep 2
          done


      # ----------------------------------------------------------------------
      # Database migrations
      # ----------------------------------------------------------------------

      - name: Run database migrations (upgrade head)
        working-directory: infra
        run: docker compose exec -T backend alembic upgrade head

      - name: Verify migration downgrade/upgrade cycle
        working-directory: infra
        run: |
          docker compose exec -T backend alembic downgrade -1
          docker compose exec -T backend alembic upgrade head

      - name: Seed deterministic test data
        working-directory: infra
        run: docker compose exec -T backend python -m app.scripts.seed


      # ----------------------------------------------------------------------
      # Frontend readiness
      # ----------------------------------------------------------------------

      - name: Wait for frontend readiness
        run: |
          echo "Polling http://localhost:3000 (max 120 s)..."

          for i in $(seq 1 60); do

            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready after $((i * 2)) s"
              exit 0
            fi

            if [ "$i" -eq 60 ]; then
              echo ""
              echo "Frontend did not become ready within 120 s"
              echo ""

              echo "=== Frontend logs ==="
              docker compose -f infra/docker-compose.yml \
                logs --no-color frontend || true

              exit 1
            fi

            sleep 2
          done


      # ----------------------------------------------------------------------
      # E2E test runtime
      # ----------------------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_TEST_EMAIL: admin@example.com
          E2E_TEST_PASSWORD: admin123
        run: npm run test:e2e


      # ----------------------------------------------------------------------
      # Failure artifacts
      # ----------------------------------------------------------------------

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 7


      # ----------------------------------------------------------------------
      # Diagnostics
      # ----------------------------------------------------------------------

      - name: Collect service logs
        if: always()
        working-directory: infra
        run: |
          docker compose ps -a > /tmp/compose-status.txt 2>&1 || true
          docker compose logs --no-color > /tmp/compose-logs.txt 2>&1 || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: |
            /tmp/compose-status.txt
            /tmp/compose-logs.txt
          retention-days: 7

      - name: Tear down stack
        if: always()
        working-directory: infra
        run: docker compose down -v


  # ==========================================================================
  # Security - filesystem SCA
  #
  # Advisory only.
  #
  # The production images receive blocking Trivy scans after they are built.
  # ==========================================================================

  security-scan:
    name: Security Scan (filesystem)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate filesystem Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          # Required because SARIF otherwise includes all severities.
          limit-severities-for-sarif: true
          # Advisory only.
          exit-code: "0"

      - name: Upload filesystem Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
        continue-on-error: true


  # ==========================================================================
  # E. Build & publish immutable production images
  #
  # main/master only
  # ==========================================================================

  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest

    needs:
      - integration

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------------------
      # Resolve image names
      #
      # GHCR repository owners must be lower-case.
      # ----------------------------------------------------------------------

      - name: Compute image names
        id: names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "backend=${REGISTRY}/${OWNER}/invoice-tracker-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${OWNER}/invoice-tracker-frontend" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}


      # ----------------------------------------------------------------------
      # Docker metadata
      # ----------------------------------------------------------------------

      - name: Docker metadata - backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata - frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.frontend }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}


      # ----------------------------------------------------------------------
      # Build and push production backend image
      #
      # pull: true forces BuildKit to refresh the base image before building.
      # ----------------------------------------------------------------------

      - name: Build and push backend image
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          target: production

          push: true
          pull: true

          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true


      # ----------------------------------------------------------------------
      # Build and push production frontend image
      # ----------------------------------------------------------------------

      - name: Build and push frontend image
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          target: production

          push: true
          pull: true

          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true


      # ======================================================================
      # Trivy SARIF reporting
      #
      # These scans populate GitHub Security but do NOT fail the job.
      #
      # Blocking enforcement is handled separately below.
      # ======================================================================


      # ----------------------------------------------------------------------
      # Backend SARIF report
      # ----------------------------------------------------------------------

      - name: Generate backend Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.backend }}@${{ steps.push-backend.outputs.digest }}
          format: sarif
          output: trivy-backend.sarif
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"


      # ----------------------------------------------------------------------
      # Frontend SARIF report
      # ----------------------------------------------------------------------

      - name: Generate frontend Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.frontend }}@${{ steps.push-frontend.outputs.digest }}
          format: sarif
          output: trivy-frontend.sarif
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"


      # ======================================================================
      # Upload SARIF reports
      # ======================================================================

      - name: Upload backend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image
        continue-on-error: true

      - name: Upload frontend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image
        continue-on-error: true


      # ======================================================================
      # Blocking production image vulnerability gates
      #
      # Policy:
      #
      #   - vulnerability scanner only
      #   - CRITICAL severity only
      #   - ignore vulnerabilities that have no upstream fix
      #   - fail if a fixable CRITICAL vulnerability remains
      #
      # Table format ensures the package/CVE/fixed version is visible directly
      # in the GitHub Actions log.
      # ======================================================================


      # ----------------------------------------------------------------------
      # Backend gate
      # ----------------------------------------------------------------------

      - name: Enforce backend CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.backend }}@${{ steps.push-backend.outputs.digest }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"


      # ----------------------------------------------------------------------
      # Frontend gate
      #
      # always() means we still scan the frontend if the backend fails so one
      # CI run reports both image results.
      # ----------------------------------------------------------------------

      - name: Enforce frontend CRITICAL vulnerability gate
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.frontend }}@${{ steps.push-frontend.outputs.digest }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"