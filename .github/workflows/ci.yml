name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  pull-requests: read
  packages: write # required for GHCR push in the publish job

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

# ============================================================================
# A. Backend quality - ALL gates are blocking
# ============================================================================
jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (incl. dev)
        run: uv sync --all-extras --dev

      - name: Lint (Ruff)
        run: uv run ruff check app tests

      - name: Format check (Ruff)
        run: uv run ruff format --check app tests

      - name: Type check (MyPy)
        run: uv run mypy app

      - name: Security scan (Bandit)
        run: uv run bandit -r app -ll

      - name: Tests with coverage
        env:
          JWT_SECRET: _Bk2swV-irvgVGswT169WWh4ty2DFVgvTS9q3_KtlHo
          ENVIRONMENT: development
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================================================
  # B. Frontend quality - ALL gates are blocking
  # ============================================================================
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        # Blocks on HIGH/CRITICAL vulnerabilities in production dependencies.
        # Development-only dependencies are excluded.
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Nuxt type stubs
        run: npx nuxt prepare

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: apps/frontend/coverage/
          flags: frontend
          fail_ci_if_error: false

      - name: Production build
        # NUXT_API_BASE is runtime-only private config and is not baked
        # into the application bundle.
        run: npm run build

  # ============================================================================
  # C + D. Integration & E2E
  # ============================================================================
  integration:
    name: Integration & E2E
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start full stack
        working-directory: infra
        run: docker compose up --build -d

      # ------------------------------------------------------------------------
      # Poll backend readiness - no fixed sleep
      # ------------------------------------------------------------------------
      - name: Wait for backend readiness
        run: |
          echo "Polling http://localhost:8000/healthz (max 120 s)..."

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend ready after $((i * 2)) s"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Backend did not become ready within 120 s"
              exit 1
            fi

            sleep 2
          done

      # ------------------------------------------------------------------------
      # Database migrations
      # ------------------------------------------------------------------------
      - name: Run database migrations (upgrade head)
        working-directory: infra
        run: docker compose exec -T backend alembic upgrade head

      - name: Verify migration downgrade/upgrade cycle
        working-directory: infra
        run: |
          docker compose exec -T backend alembic downgrade -1
          docker compose exec -T backend alembic upgrade head

      - name: Seed deterministic test data
        working-directory: infra
        run: docker compose exec -T backend python -m app.scripts.seed

      # ------------------------------------------------------------------------
      # Poll frontend readiness
      # ------------------------------------------------------------------------
      - name: Wait for frontend readiness
        run: |
          echo "Polling http://localhost:3000 (max 120 s)..."

          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready after $((i * 2)) s"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Frontend did not become ready within 120 s"
              exit 1
            fi

            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      # ------------------------------------------------------------------------
      # E2E tests
      # ------------------------------------------------------------------------
      - name: Run E2E tests
        working-directory: apps/frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_TEST_EMAIL: admin@example.com
          E2E_TEST_PASSWORD: admin123
        run: npm run test:e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 7

      # ------------------------------------------------------------------------
      # Diagnostics
      # ------------------------------------------------------------------------
      - name: Collect service logs
        if: always()
        working-directory: infra
        run: docker compose logs --no-color > /tmp/compose-logs.txt 2>&1

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
          retention-days: 7

      - name: Tear down stack
        if: always()
        working-directory: infra
        run: docker compose down -v

  # ============================================================================
  # Security - filesystem SCA scan
  #
  # Advisory only.
  #
  # Production container vulnerability enforcement happens later against the
  # actual backend and frontend images.
  # ============================================================================
  security-scan:
    name: Security Scan (filesystem)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate filesystem Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

          # Vulnerability scanning only.
          scanners: vuln

          # Report critical vulnerabilities.
          severity: CRITICAL

          # Do not report vulnerabilities for which upstream provides
          # no remediation yet.
          ignore-unfixed: true

          # SARIF normally includes all severities unless this is enabled.
          limit-severities-for-sarif: true

          # Advisory scan - never blocks CI.
          exit-code: "0"

      - name: Upload filesystem Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
        continue-on-error: true

  # ============================================================================
  # E. Build & publish immutable production images
  #
  # main/master only
  # ============================================================================
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest

    needs:
      - integration

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Resolve image names
      #
      # GHCR repository owner must be lower-case.
      # ------------------------------------------------------------------------
      - name: Compute image names
        id: names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "backend=${REGISTRY}/${OWNER}/invoice-tracker-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${OWNER}/invoice-tracker-frontend" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # ------------------------------------------------------------------------
      # Docker metadata - backend
      # ------------------------------------------------------------------------
      - name: Docker metadata - backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ------------------------------------------------------------------------
      # Docker metadata - frontend
      # ------------------------------------------------------------------------
      - name: Docker metadata - frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.frontend }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ------------------------------------------------------------------------
      # Build and push production backend image
      #
      # Includes:
      #   - OCI provenance
      #   - SBOM
      #   - immutable SHA tag
      #   - latest tag on default branch
      # ------------------------------------------------------------------------
      - name: Build and push backend image
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ------------------------------------------------------------------------
      # Build and push production frontend image
      # ------------------------------------------------------------------------
      - name: Build and push frontend image
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ========================================================================
      # Trivy SARIF reporting
      #
      # These scans generate GitHub Security reports but DO NOT fail the job.
      #
      # Security enforcement is performed by separate table-format scans below.
      # ========================================================================

      # ------------------------------------------------------------------------
      # Backend SARIF report
      # ------------------------------------------------------------------------
      - name: Generate backend Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.backend }}@${{ steps.push-backend.outputs.digest }}

          format: sarif
          output: trivy-backend.sarif

          scanners: vuln

          severity: CRITICAL

          ignore-unfixed: true

          # Important:
          # without this option SARIF output can include all severities.
          limit-severities-for-sarif: true

          # Reporting only.
          exit-code: "0"

      # ------------------------------------------------------------------------
      # Frontend SARIF report
      # ------------------------------------------------------------------------
      - name: Generate frontend Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.frontend }}@${{ steps.push-frontend.outputs.digest }}

          format: sarif
          output: trivy-frontend.sarif

          scanners: vuln

          severity: CRITICAL

          ignore-unfixed: true

          limit-severities-for-sarif: true

          # Reporting only.
          exit-code: "0"

      # ========================================================================
      # Upload image SARIF reports
      # ========================================================================

      - name: Upload backend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image
        continue-on-error: true

      - name: Upload frontend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image
        continue-on-error: true

      # ========================================================================
      # Blocking production image security gates
      #
      # Policy:
      #
      #   - vulnerability scanner only
      #   - CRITICAL vulnerabilities only
      #   - ignore vulnerabilities without an upstream fix
      #   - fail with exit code 1 when a matching vulnerability exists
      #
      # Table format is intentional because it prints the exact package,
      # CVE, installed version and fixed version directly in Actions logs.
      # ========================================================================

      # ------------------------------------------------------------------------
      # Backend blocking gate
      # ------------------------------------------------------------------------
      - name: Enforce backend CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.backend }}@${{ steps.push-backend.outputs.digest }}

          format: table

          scanners: vuln

          severity: CRITICAL

          ignore-unfixed: true

          exit-code: "1"

      # ------------------------------------------------------------------------
      # Frontend blocking gate
      #
      # always() ensures that if the backend has a vulnerability we still get
      # the frontend result during the same pipeline execution.
      # ------------------------------------------------------------------------
      - name: Enforce frontend CRITICAL vulnerability gate
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: >-
            ${{ steps.names.outputs.frontend }}@${{ steps.push-frontend.outputs.digest }}

          format: table

          scanners: vuln

          severity: CRITICAL

          ignore-unfixed: true

          exit-code: "1"