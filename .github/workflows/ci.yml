name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # Backend Testing & Quality Checks
  # ============================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    # Tests use SQLite in-memory database, no PostgreSQL needed for unit tests
    
    defaults:
      run:
        working-directory: apps/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      
      - name: Run linting (Ruff)
        run: |
          uv run ruff check app tests
      
      - name: Run formatting check (Ruff)
        run: |
          uv run ruff format --check app tests
      
      - name: Run type checking (MyPy)
        run: |
          uv run mypy app
        continue-on-error: true  # Don't fail build on type errors initially
      
      - name: Run security scan (Bandit)
        run: |
          uv run bandit -r app -ll
      
      - name: Run tests with coverage
        env:
          # Tests use SQLite in-memory database (configured in conftest.py)
          # DATABASE_URL is intentionally NOT set here - let tests use their own config
          JWT_SECRET: _Bk2swV-irvgVGswT169WWh4ty2DFVgvTS9q3_KtlHo
          ENVIRONMENT: development
        run: |
          uv run pytest --cov --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================================================
  # Frontend Testing & Quality Checks
  # ============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint || echo "Linting not configured"
        continue-on-error: true
      
      - name: Run type checking
        run: npx nuxi typecheck
        continue-on-error: true
      
      - name: Build frontend
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1

  # ============================================================================
  # Docker Build Test
  # ============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: false
          tags: invoice-tracker-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          target: development
          push: false
          tags: invoice-tracker-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start services with Docker Compose
        run: |
          cd infra
          docker compose up -d
          sleep 20  # Wait for services to be ready
      
      - name: Check backend health
        run: |
          curl -f http://localhost:8000/healthz || exit 1
      
      - name: Check backend readiness
        run: |
          curl -f http://localhost:8000/readiness || exit 1
      
      - name: Run database migrations
        run: |
          docker compose -f infra/docker-compose.yml exec -T backend alembic upgrade head
      
      - name: Seed test data
        run: |
          docker compose -f infra/docker-compose.yml exec -T backend python -m app.scripts.seed
      
      - name: Check frontend health
        run: |
          curl -f http://localhost:3000 || exit 1
      
      - name: Stop services
        if: always()
        run: |
          cd infra
          docker compose logs
          docker compose down -v

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
