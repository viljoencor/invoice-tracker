[alembic]
script_location = migrations
sqlalchemy.url = postgresql://postgres:postgres@db:5432/invoicer

# --- Classic logging config expected by logging.config.fileConfig ---
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0

[logger_sqlalchemy]
level = WARN
handlers = 
qualname = sqlalchemy.engine
propagate = 0

[handler_console]
class = StreamHandler
level = NOTSET
formatter = generic
args = ()

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
