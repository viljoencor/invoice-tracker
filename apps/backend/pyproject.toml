[project]
name = "invoice-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Invoice Tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "SQLAlchemy>=2.0.36",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "argon2-cffi>=23.1.0",
  "pyjwt[crypto]>=2.9.0",
  "structlog>=24.1.0",
  "python-multipart>=0.0.9",
  "reportlab>=4.2.5",
  "psycopg2-binary>=2.9.9",
  "email-validator>=2.1.0",
  "slowapi>=0.1.9",
  "tenacity>=8.2.3",
  "prometheus-fastapi-instrumentator>=0.9.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Tell Hatchling what to include in the wheel
[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
test = "pytest:main"

# Use uv's new dependency groups (replaces tool.uv.dev-dependencies)
[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.5",
  "mypy>=1.11.0",
  "bandit[toml]>=1.7.5",
  "faker>=25.0.0",
  "aiosqlite>=0.20.0",
]

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"tests/**/*.py" = ["ARG", "S101"]  # Allow unused args and asserts in tests

# ============================================================================
# MyPy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
exclude = ["migrations/", "scripts/"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=50",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ============================================================================
# Bandit Configuration
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]
