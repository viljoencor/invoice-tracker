events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;

    # HSTS is set here because nginx is the TLS terminator.
    # All other security headers (CSP, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy) are managed by nuxt-security in the
    # Nitro layer to keep a single authoritative source and avoid duplicate values.
    # X-XSS-Protection is intentionally absent: it is deprecated (removed from
    # modern browsers) and its "block" mode can be weaponised to create
    # reflected XSS vectors on legacy browsers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Backend health check — the ONLY path routed directly to the backend.
        # Every other request flows through the Nitro BFF (frontend container).
        # The FastAPI backend is NOT publicly reachable by any other path.
        location /healthz {
            proxy_pass http://backend/healthz;
            access_log off;
        }

        # BFF auth endpoints — strict rate limit (5 r/min per IP).
        # /api/auth/{login,logout,refresh} are Nitro server routes, NOT FastAPI.
        # Nitro sets httpOnly cookies and calls the backend internally.
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # BFF proxy and all other /api/* paths — normal rate limit (10 r/s per IP).
        # /api/proxy/* is handled by Nitro, which authenticates via httpOnly cookie
        # and forwards to the backend with a Bearer token over the internal network.
        # Any unrecognised /api/* path returns 404 from Nitro.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend SPA (served by Nitro)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static assets — long-lived immutable cache
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
