# Staging Environment Configuration
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: invoicer_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_staging_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app_network

  backend:
    build:
      context: ../apps/backend
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/invoicer_staging
      ENVIRONMENT: staging
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_MINUTES: 1440
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 3600
      RATE_LIMIT_ENABLED: true
      RATE_LIMIT_PER_MINUTE: 60
      LOG_LEVEL: INFO
      LOG_JSON_FORMAT: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../apps/frontend
      target: production
    environment:
      NUXT_PUBLIC_API_BASE: ${FRONTEND_API_BASE:-http://localhost:8000}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_staging_data:
    driver: local

networks:
  app_network:
    driver: bridge
